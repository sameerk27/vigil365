# Vigil365 — one-command deployment.
#   1. cp .env.example .env   and fill in the values
#   2. docker compose up -d
#   3. open http://localhost:8080, sign in, enter Graph creds in the Setup wizard
#
# TLS: this compose serves plain HTTP on :8080 (fine for localhost — Entra allows
# http://localhost redirect URIs). For a real hostname, put a TLS reverse proxy
# (Caddy/Nginx/Traefik) in front and set REDIRECT_URI to the https URL.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./backups:/var/opt/mssql/backup
    restart: unless-stopped

  app:
    build: .
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=M365SecurityDashboard;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=true"
      AzureAd__Instance: "https://login.microsoftonline.com/"
      AzureAd__TenantId: "${TENANT_ID}"
      AzureAd__ClientId: "${CLIENT_ID}"
      AzureAd__Audience: "api://${CLIENT_ID}"
      Auth__RedirectUri: "${REDIRECT_URI:-http://localhost:8080}"
      Auth__BootstrapAdminEmail: "${ADMIN_EMAIL}"
      Logging__File__Path: "/app/logs/vigil365-.json"
    volumes:
      - dp-keys:/keys
      - vigil365-logs:/app/logs
    restart: unless-stopped

volumes:
  mssql-data:
  dp-keys:
  vigil365-logs:
